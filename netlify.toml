[build]
  functions = "netlify/functions"
  publish = "."

[dev]
  framework = "#static"
  publish = "."
  functions = "netlify/functions"
  port = 8888

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"

# Klaviyo posts retired 2026-09-30 (site back to ActiveCampaign-only). 301 to the closest AC post.
[[redirects]]
  from = "/blog/klaviyo-abandoned-cart-flow.html"
  to = "/blog/abandon-cart-without-guilt.html"
  status = 301

